name: NFE

on:
  push:
    paths: ["NFE/**", ".github/workflows/nfe.yml"]
  pull_request:
    paths: ["NFE/**", ".github/workflows/nfe.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NFE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NFE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
