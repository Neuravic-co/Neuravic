name: NFE

on:
  push:
  pull_request:
  merge_group:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: NFE and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NFE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NFE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: local-csp-fixture
      - name: Validate the Vercel Next.js build
        run: npx next build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: local-csp-fixture
      - name: Install backend and browser test dependencies
        working-directory: .
        run: npm ci --prefix NBE && npm ci --prefix Test
      - name: Install test browser
        working-directory: Test
        run: npx playwright install --with-deps chromium
      - name: Browser integration and accessibility
        working-directory: NBE
        run: npm run test:browser
        env:
          CSP_EXPECT_TURNSTILE: "true"
