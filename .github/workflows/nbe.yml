name: NBE

on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NBE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NBE/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations are up to date
        run: |
          npx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            echo "Schema changed without a committed migration. Run: npm run db:generate"
            git status --porcelain -- migrations
            exit 1
          fi
