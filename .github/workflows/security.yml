name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # every Monday, so new advisories are caught even without code changes

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./Security/scripts/security-check.sh
