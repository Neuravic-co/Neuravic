name: NBE

on:
  push:
  pull_request:
  merge_group:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: NBE checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: helm lint deployment/helm/neuravic
      - run: helm template ci deployment/helm/neuravic > /dev/null


  contact-email:
    name: Contact email and Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: neuravic_contact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/neuravic_contact_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:email
      - run: npm ci --prefix nfe
      - run: npm run build --prefix nfe
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: contact-test-site-key
          NEXT_PUBLIC_API_BASE_URL: ""
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contact-e2e
