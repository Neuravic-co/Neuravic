x-backend: &backend
  build:
    context: ..
    dockerfile: deployment/docker/backend.Dockerfile
  image: neuravic-backend:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &backend-env
    APP_ENV: ${APP_ENV:-production}
    APP_URL: ${APP_URL:?set APP_URL}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
    EMAIL_FROM: ${EMAIL_FROM:-Neuravic <no-reply@neuravic.com>}
    NOTIFY_TO: ${NOTIFY_TO:?set NOTIFY_TO}
    DATABASE_URL: postgres://neuravic_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/neuravic
    PRIVACY_HASH_SECRET: ${PRIVACY_HASH_SECRET:?set PRIVACY_HASH_SECRET}
    PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
    CRON_SECRET: ${CRON_SECRET:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    SMTP_URL: ${SMTP_URL:-}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neuravic
      PGDATA: /var/lib/postgresql/data/pgdata
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuravic"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    restart: "no"
    command: ["node", "--import", "tsx", "database/scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL_UNPOOLED: postgres://neuravic_migrator:${MIGRATE_DB_PASSWORD}@postgres:5432/neuravic

  backend:
    <<: *backend

  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: neuravic-frontend:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      API_ORIGIN: http://backend:8787
      ALLOW_INSECURE_API_ORIGIN: "true"
      API_PROXY_SECRET: ${PROXY_SECRET}
    depends_on: [backend]
    ports:
      - "5173:5173"

volumes:
  postgres-data:
