# Example only. Do not commit a filled-in copy. Create the real Secret straight from the command line instead:
#
#   kubectl -n neuravic create secret generic neuravic-secrets \
#     --from-literal=DATABASE_URL='mysql://neuravic_app:<password>@<host>:3306/neuravic' \
#     --from-literal=MIGRATE_DATABASE_URL='mysql://neuravic_migrator:<password>@<host>:3306/neuravic' \
#     --from-literal=PRIVACY_HASH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MFA_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=PROXY_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=RESEND_API_KEY='<optional>' \
#     --from-literal=SMTP_URL='<optional, instead of RESEND_API_KEY>'
#
# Better still, sync it from a secret manager (External Secrets Operator, Sealed Secrets or your cloud's CSI driver).
apiVersion: v1
kind: Secret
metadata:
  name: neuravic-secrets
  namespace: neuravic
type: Opaque
stringData:
  DATABASE_URL: mysql://neuravic_app:CHANGE_ME@mysql.example.internal:3306/neuravic
  MIGRATE_DATABASE_URL: mysql://neuravic_migrator:CHANGE_ME@mysql.example.internal:3306/neuravic
  PRIVACY_HASH_SECRET: CHANGE_ME_32_OR_MORE_RANDOM_CHARACTERS
  MFA_ENCRYPTION_KEY: CHANGE_ME_64_HEX_CHARACTERS
  PROXY_SECRET: CHANGE_ME_32_OR_MORE_RANDOM_CHARACTERS

  # Contact intake fails closed without this in staging/production.
  TURNSTILE_SECRET: CHANGE_ME
  # Choose a provider; keep the real key or SMTP URL in the secret manager.
  RESEND_API_KEY: CHANGE_ME
