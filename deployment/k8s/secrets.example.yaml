apiVersion: v1
kind: Secret
metadata:
  name: neuravic-secrets
  namespace: neuravic
type: Opaque
stringData:
  DATABASE_URL: postgres://neuravic_app:CHANGE_ME@postgres.example.internal:5432/neuravic
  DATABASE_URL_UNPOOLED: postgres://neuravic_migrator:CHANGE_ME@postgres.example.internal:5432/neuravic
  PRIVACY_HASH_SECRET: CHANGE_ME_32_OR_MORE_RANDOM_CHARACTERS
  PROXY_SECRET: CHANGE_ME_32_OR_MORE_RANDOM_CHARACTERS
  CRON_SECRET: CHANGE_ME_32_OR_MORE_RANDOM_CHARACTERS
  TURNSTILE_SECRET: CHANGE_ME
  RESEND_API_KEY: CHANGE_ME
