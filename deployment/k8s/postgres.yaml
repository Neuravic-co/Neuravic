apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: neuravic
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: neuravic-postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuravic-postgres-init
  namespace: neuravic
data:
  01-access.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE neuravic_app LOGIN PASSWORD '${APP_DB_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE;
    CREATE ROLE neuravic_migrator LOGIN PASSWORD '${MIGRATE_DB_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO neuravic_migrator;
    GRANT USAGE ON SCHEMA public TO neuravic_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE neuravic_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO neuravic_app;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: neuravic
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: neuravic-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neuravic-postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: neuravic }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: neuravic-postgres, key: admin-password } } }
            - { name: APP_DB_PASSWORD, valueFrom: { secretKeyRef: { name: neuravic-postgres, key: app-password } } }
            - { name: MIGRATE_DB_PASSWORD, valueFrom: { secretKeyRef: { name: neuravic-postgres, key: migrate-password } } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "neuravic"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: neuravic-postgres-init, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuravic-postgres
  namespace: neuravic
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: neuravic-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { neuravic/tier: backend }
      ports:
        - { protocol: TCP, port: 5432 }
