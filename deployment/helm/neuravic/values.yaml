image:
  backend: ghcr.io/neuravic-co/neuravic-backend
  frontend: ghcr.io/neuravic-co/neuravic-frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

existingSecret: neuravic-secrets

config:
  appEnv: production
  appUrl: https://www.example.com
  allowedOrigins: https://www.example.com
  emailFrom: "Neuravic <no-reply@example.com>"
  notifyTo: team@example.com
  maintenanceMode: "false"

ingress:
  enabled: true
  className: nginx
  host: www.example.com
  tlsSecretName: neuravic-tls
  annotations: {}

backend:
  port: 8787
  replicas: 2

frontend:
  replicas: 2
  port: 5173

resources:
  backend:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }
  frontend:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

autoscaling:
  enabled: false
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  databaseCidr: 10.0.0.0/8

migration:
  enabled: true
