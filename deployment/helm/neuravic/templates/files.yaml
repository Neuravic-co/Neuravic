apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neuravic-files
  labels:
    {{- include "neuravic.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.files.persistence.storageClass }}
  storageClassName: {{ .Values.files.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.files.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuravic-files
  labels:
    {{- include "neuravic.labels" . | nindent 4 }}
    app.kubernetes.io/name: neuravic-files
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: neuravic-files
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuravic-files
        neuravic/tier: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- include "neuravic.podSecurity" . | nindent 6 }}
      containers:
        - name: files
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "neuravic.containerSecurity" . | nindent 10 }}
          ports:
            - { name: http, containerPort: {{ .Values.files.port }} }
          env:
            - { name: ENTRY, value: "server/src/index.ts" }
            - { name: FILES_PORT, value: {{ .Values.files.port | quote }} }
            - { name: UPLOAD_DIR, value: /data/uploads }
            {{- include "neuravic.backendEnv" . | nindent 12 }}
            - name: MALWARE_SCANNER_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: MALWARE_SCANNER_URL, optional: true }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{ toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: uploads, mountPath: /data/uploads }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: uploads
          persistentVolumeClaim:
            claimName: neuravic-files
---
apiVersion: v1
kind: Service
metadata:
  name: neuravic-files
  labels:
    {{- include "neuravic.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: neuravic-files
  ports:
    - { name: http, port: {{ .Values.files.port }}, targetPort: http }
