{{- /* Optional autoscaling for the stateless services, and a disruption budget so upgrades never take a service fully down. */ -}}
{{- $stateless := dict "gateway" .Values.services.gateway "auth" .Values.services.auth "portal" .Values.services.portal "leads" .Values.services.leads -}}
{{- range $name, $svc := $stateless }}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuravic-{{ $name }}
  labels:
    {{- include "neuravic.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: neuravic-{{ $name }} }
  minReplicas: {{ $svc.replicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if gt (int $svc.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neuravic-{{ $name }}
  labels:
    {{- include "neuravic.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuravic-{{ $name }}
{{- end }}
{{- end }}
