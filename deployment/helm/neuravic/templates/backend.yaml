{{- /* One Deployment and one Service for every entry in .Values.services. */ -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuravic-{{ $name }}
  labels:
    {{- include "neuravic.labels" $ | nindent 4 }}
    app.kubernetes.io/name: neuravic-{{ $name }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: neuravic-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuravic-{{ $name }}
        neuravic/tier: backend
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- include "neuravic.podSecurity" $ | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.backend }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "neuravic.containerSecurity" $ | nindent 10 }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
          env:
            - { name: ENTRY, value: {{ $svc.entry | quote }} }
            - { name: {{ upper $name }}_PORT, value: {{ $svc.port | quote }} }
            {{- include "neuravic.backendEnv" $ | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{ toYaml $.Values.resources.backend | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: neuravic-{{ $name }}
  labels:
    {{- include "neuravic.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: neuravic-{{ $name }}
  ports:
    - { name: http, port: {{ $svc.port }}, targetPort: http }
{{- end }}
