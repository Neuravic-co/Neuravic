{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: neuravic-migrate
  labels:
    {{- include "neuravic.labels" . | nindent 4 }}
  annotations:
    # Runs before the new pods start, on every install and upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuravic-migrate
        neuravic/tier: backend
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "neuravic.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "neuravic.containerSecurity" . | nindent 10 }}
          env:
            - { name: ENTRY, value: "database/scripts/migrate.ts" }
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: MIGRATE_DATABASE_URL }
          resources: {{ toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
